name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Analyze (errors and warnings fail, lint infos are listed)
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Tokens still match the live tokens.css
        continue-on-error: true
        run: |
          node tool/gen_tokens.js
          git diff --stat --exit-code lib/src/tokens.g.dart || { echo "::warning::tokens.css on the DS site changed. Run: node tool/gen_tokens.js and commit lib/src/tokens.g.dart"; exit 1; }

      - name: Build the gallery for the web
        working-directory: example
        run: |
          flutter create --platforms=web --project-name albatross_ds_gallery --no-overwrite .
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: example/build/web

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
